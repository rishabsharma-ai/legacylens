[project]
name = "legacylens"
version = "0.1.0"
description = "Context engineering for mainframe code: COBOL to Spanner Graph, docs to linked vectors, Google ADK Q&A"
readme = "README.md"
authors = [{ name = "Rishab Sharma" }]
requires-python = ">=3.12"
dependencies = [
    "google-cloud-spanner>=3.71.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["emulator: needs the Spanner emulator running"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
